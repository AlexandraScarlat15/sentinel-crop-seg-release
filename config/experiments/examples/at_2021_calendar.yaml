schema_version: 1
name: at_2021_wheat_calendar_demo
settings:
  eurocrops:
    shapefile_path: data/external/eurocrops/AT_2021/AT_2021_EC21.shp
  catalog:
    stac:
      start_date: "2021-04-01T00:00:00Z"
      end_date: "2021-09-30T23:59:59Z"
      max_cloud_cover: 10
    calendar:
      mode: selected_crop_union
      file: config/crop_calendar_recalibrated_v0_3.csv
      country: AT
      year: 2021
      crops: [Wheat]
  dataset:
    roi:
      strategy: grid
    target:
      class_id: 3
      total_patches: 100
  paths:
    dataset_output_dir: data/processed/examples/at_2021_wheat_calendar
